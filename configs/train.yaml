run:
  name: maestro-allof-prepro-${oc.env:SLURM_JOB_ID,local}

training:
  devices: "0,1,2,3"
  data_directories:
    - data/raw/preprocessed-cyto-sources/allof
    - data/raw/preprocessed-cyto-sources/prepro
  random_seed: 206
  number_cells_subset: 40000
  input_dimension: 30
  number_inducing_points: 16
  hidden_dimension: 384
  latent_dimension: 256
  number_attention_heads: 1
  layer_normalization: true
  initial_learning_rate: 0.0001
  minimum_learning_rate: 1.0e-12
  number_epochs: 500
  sinkhorn_start_epoch: 25
  number_outputs: 40000
  student_temperature: 0.11
  teacher_temperature: 0.04
  teacher_temperature_step: 0.01
  center_momentum: 0.9
  teacher_beta: 0.99
  resume_checkpoint: null

hydra:
  job:
    chdir: false
  run:
    dir: experiments/${run.name}/hydra/rank-${oc.env:SLURM_LOCALID,0}
  # The launcher already saves one base and one fully resolved configuration.
  # Keep per-rank Hydra logs, but do not duplicate the config snapshot four times.
  output_subdir: null
